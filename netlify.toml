# Netlify 배포 설정. 화면은 public/ 그대로, API는 api/*.js를 netlify/functions 어댑터로 실행한다.
[build]
  publish = "public"
  functions = "netlify/functions"
  # PR 미리보기는 빌드하지 않는다 (크레딧 절약, 2026-11-14 대표 결정). 확인은 로컬 node tools/dev-server.js.
  # 종료 코드 0 = 건너뜀. 운영(production) 배포는 그대로 빌드된다.
  ignore = "[ \"$CONTEXT\" = \"deploy-preview\" ]"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200
  force = true

[[redirects]]
  from = "/api/booking-admin"
  to = "/.netlify/functions/booking-admin"
  status = 200
  force = true

[[redirects]]
  from = "/api/deposit"
  to = "/.netlify/functions/deposit"
  status = 200
  force = true

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200
  force = true

[[redirects]]
  from = "/api/inbox"
  to = "/.netlify/functions/inbox"
  status = 200
  force = true

[[redirects]]
  from = "/api/ledger"
  to = "/.netlify/functions/ledger"
  status = 200
  force = true

[[redirects]]
  from = "/api/marketing"
  to = "/.netlify/functions/marketing"
  status = 200
  force = true

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 개인 가계부 → 감탄 장부 자동 가져오기: 매일 21:00 UTC = 06:00 KST
[functions."ledger-sync"]
  schedule = "0 21 * * *"
