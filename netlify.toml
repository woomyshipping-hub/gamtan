# Netlify 배포 설정. 화면은 public/ 그대로, API는 api/*.js를 netlify/functions 어댑터로 실행한다.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200
  force = true

[[redirects]]
  from = "/api/inbox"
  to = "/.netlify/functions/inbox"
  status = 200
  force = true

[[redirects]]
  from = "/api/ledger"
  to = "/.netlify/functions/ledger"
  status = 200
  force = true

[[redirects]]
  from = "/api/marketing"
  to = "/.netlify/functions/marketing"
  status = 200
  force = true

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 개인 가계부 → 감탄 장부 자동 가져오기: 매일 21:00 UTC = 06:00 KST
[functions."ledger-sync"]
  schedule = "0 21 * * *"
