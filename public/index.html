<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>감탄 정산</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/assets/theme.css">
<style>
/* 전광판(라인 스코어) 정산 화면. PC 우선, 밝은 화면.
   주간: 월~일 × (정산받을 총액·김한준님·킴) + 주 합계 / 월간: 주차 × 같은 3줄 + 월 합계.
   전광판 칸은 끝난 일정만 더한다(기존 agg 규칙). 아래는 주간 7일 칸 / 월간 달력. */
/* 색·글꼴·기본 규칙은 /assets/theme.css */
.wrap{max-width:1200px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);border-radius:7px;padding:6px 18px;cursor:pointer;transition:background .15s ease-out,color .15s ease-out}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.tbtn{font:inherit;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;height:38px;cursor:pointer;transition:background .15s ease-out}
.nav button{width:38px;font-size:1.1rem}
.nav button:hover,.tbtn:hover{background:var(--cell)}
.nav button:disabled{opacity:.35;cursor:default}
.nav strong{min-width:170px;text-align:center;font-size:1.05rem}
.tbtn{padding:0 14px;font-size:.9rem}
.status{font-size:.82rem;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:.9rem}

/* 전광판 */
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;display:grid;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.bhead strong{font-size:1.1rem}
.sm{font-size:.85rem;color:var(--muted)}
.sm b{color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:1px 7px;font-weight:700}
.bwrap{overflow-x:auto}
table.score{width:100%;border-collapse:separate;border-spacing:5px;min-width:760px;table-layout:fixed}
.score col.lc{width:128px}.score col.tc{width:184px}
.score th{font-size:.85rem;font-weight:600;color:var(--muted);padding:2px 4px 4px;text-align:center;white-space:nowrap}
.score th span{font-weight:500}
.score th.today{color:var(--amber-ink)}
.score th.today span{background:var(--amber);color:#fff;border-radius:6px;padding:1px 6px;font-weight:700}
.score th button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:2px 8px;border-radius:6px}
.score th button span{display:block;font-size:.75rem}
.score th button:hover{background:var(--cell);color:var(--ink)}
.score th.tot{color:var(--amber-ink)}
.score td{background:var(--cell);border-radius:8px;text-align:center;font-size:1.25rem;font-weight:700;padding:12px 6px;color:var(--ink);white-space:nowrap}
.score td.z{color:#bdbdbd;font-weight:500}
.score td small{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:1px}
.score th.l{text-align:left;font-size:.92rem;font-weight:600;color:var(--ink);padding:0 4px 0 2px}
.score td.tot{background:var(--amber-soft);color:var(--amber-ink);font-size:1.45rem;font-weight:800;box-shadow:inset 0 0 0 1px #f1c56e}
.score tr.mine th.l{color:var(--accent)}
.score tr.mine td:not(.tot):not(.z){color:var(--accent)}
.score tr.mine td.tot{background:var(--amber);color:#fff;box-shadow:none}
.score td.cur{box-shadow:inset 0 0 0 2px var(--amber)}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.lk{font:inherit;font-size:.88rem;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.mside{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.mside b{color:var(--ink);font-size:1rem}
.pending{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.8rem;border-radius:999px;padding:3px 10px;background:var(--warn-soft);color:var(--ink)}

/* 주간 7일 */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:300px;display:flex;flex-direction:column;min-width:0}
.wd.today{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.wd.out{opacity:.55}
.wdh{display:flex;align-items:baseline;justify-content:space-between;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.wdh b{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.wdh span{font-size:.85rem;color:var(--muted);font-weight:600}
.wd.today .wdh b{color:var(--amber-ink)}
.slot{padding:8px 8px 6px;display:grid;gap:6px;align-content:start}
.slot + .slot{border-top:1px dashed var(--line2)}
.slot > i{font-style:normal;font-size:.72rem;color:var(--muted);font-weight:600}
.wd .jb .n{font-size:.82rem;-webkit-line-clamp:3}
.wd .jb .a{font-size:.9rem}
.wd .jb{padding:6px 8px;border-left-width:4px;border-radius:7px}
.wsum{margin-top:auto;padding:8px 12px 10px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:.8rem;color:var(--muted)}
.wsum b{text-align:right;color:var(--ink)}
.wsum .m{color:var(--accent)}
.wsum.est{opacity:.6}

/* 월간 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.dow{padding:8px 0;text-align:center;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--cell);border-bottom:1px solid var(--line)}
.day{min-width:0;min-height:128px;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.day:nth-child(7n){border-right:0}
.day.selw{background:#f7f7f7}
.day.pre{opacity:.4}
.dn{font:inherit;font-size:.95rem;font-weight:700;background:none;border:0;color:var(--ink);text-align:left;padding:6px 8px 2px;cursor:pointer;min-height:30px}
.dn:hover{color:var(--amber-ink)}
.dn:disabled{cursor:default}
.day.out .dn{opacity:.4}
.day.today .dn span{background:var(--amber);color:#fff;border-radius:6px;padding:0 6px}
.half{min-height:34px;padding:3px 5px;display:grid;gap:3px;align-content:start}
.half.pm{border-top:1px dashed var(--line)}
.jb{font:inherit;display:grid;text-align:left;width:100%;min-width:0;border:0;border-left:3px solid var(--crin);background:var(--crin-soft);color:var(--ink);border-radius:5px;padding:3px 5px;cursor:pointer;line-height:1.25;transition:filter .15s ease-out}
.jb:hover{filter:brightness(.97)}
.jb.own{border-left-color:var(--own);background:var(--own-soft)}
.jb .n{font-size:.72rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.jb .a{font-size:.76rem;font-weight:700;overflow-wrap:anywhere}
.jb.future{opacity:.62}
.jb.warn{outline:1.5px solid var(--warn)}
.jb.warn .a{color:var(--warn)}
.jb.cancel{text-decoration:line-through;opacity:.45}
.dsum{display:grid;grid-template-columns:auto 1fr;gap:0 6px;padding:4px 8px 6px;font-size:.72rem;line-height:1.3;border-top:1px solid var(--line);margin-top:auto;color:var(--muted)}
.dsum .v{font-weight:700;text-align:right;color:var(--ink)}
.dsum .m{color:var(--accent)}
.dsum.est{opacity:.6}
.legend{margin:10px 2px 0;font-size:.8rem;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);padding:18px;overflow:auto;box-shadow:0 20px 60px rgba(23,25,28,.18)}
dialog::backdrop{background:rgba(23,25,28,.35)}
.xrow{display:flex;justify-content:flex-end;margin-bottom:4px}
.xbtn{font:inherit;font-size:.85rem;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
.job{display:grid;gap:12px}
.job .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.job .top > div{min-width:0}
.job .t{font-weight:700;font-size:1.05rem}
.job .meta{font-size:.82rem;color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px}
.tag.crin{background:var(--crin-soft)} .tag.own{background:var(--own-soft)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.amt{text-align:right;white-space:nowrap}
.amt b{font-size:1.05rem}
.amt div{font-size:.78rem;color:var(--muted)}
.amt .bd{font-size:.72rem;white-space:normal;opacity:.9}
.amt .who{margin-top:4px}
.inputs{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:.85rem}
.inputs label{display:flex;align-items:center;gap:6px}
.inputs input[type=number]{font:inherit;width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.inputs select{font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.inputs input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.break{font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:700}
.rates{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px 12px;align-items:center;margin-top:12px;font-size:.88rem}
.rates input{font:inherit;width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.rates .h{grid-column:1/-1;font-weight:700;margin-top:6px;font-size:.8rem;color:var(--muted)}
.sub{font-size:.78rem;color:var(--muted)}
@media (max-width:760px){.wk{grid-template-columns:1fr}.wd{min-height:0}.nav strong{min-width:130px}
  table.score{min-width:0}.score col.dc,.score .c{display:none}.score col.lc{width:auto}.score col.tc{width:60%}.score td.tot{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<main class="wrap">
  <header>
    <div class="brand"><h1 class="vh">감탄 정산</h1><b aria-hidden="true">감탄</b><nav class="apps" aria-label="화면"><a href="/" aria-current="page">정산</a><a href="/ledger/">장부</a><a href="/marketing/">마케팅</a></nav></div>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="보기">
        <button type="button" id="vWeek" aria-pressed="true">주간</button>
        <button type="button" id="vMonth" aria-pressed="false">월간</button>
      </div>
      <div class="nav">
        <button type="button" id="pprev" aria-label="이전">‹</button>
        <strong id="plabel" class="num" aria-live="polite"></strong>
        <button type="button" id="pnext" aria-label="다음">›</button>
      </div>
      <button type="button" class="tbtn" id="ptoday">이번 주</button>
    </div>
  </header>
  <div class="status" id="status">구글 캘린더에서 작업 일정을 불러오는 중입니다.</div>
  <div class="banner" id="banner" hidden></div>

  <section class="board" aria-labelledby="btitle">
    <div class="bhead">
      <div><strong id="btitle"></strong> <span class="sm num" id="bsub"></span></div>
      <span class="sm num" id="payday"></span>
    </div>
    <div class="bwrap"><table class="score num" id="score"></table></div>
    <div class="bfoot">
      <div class="mside num" id="mside"></div>
      <button type="button" class="lk" id="swap"></button>
    </div>
    <div class="pending" id="pending" hidden></div>
  </section>

  <section aria-label="달력">
    <div id="cal"></div>
    <p class="legend"><span><i style="background:var(--crin)"></i>크린토피아</span><span><i style="background:var(--own)"></i>홈클린마스터</span><span>흐린 카드·금액은 아직 끝나지 않은 일정</span><span>전광판 칸은 끝난 일정만 더합니다</span><span>일정을 누르면 추가금 입력과 계산 내역</span></p>
  </section>

  <details id="ratesBox">
    <summary>정산 기준 (단가·비율)</summary>
    <div class="rates" id="rates"></div>
    <p class="status" style="margin:10px 0 0">바꾸면 이 페이지의 모든 금액이 다시 계산되고, 다음에 열어도 유지됩니다.</p>
  </details>
</main>

<dialog id="dlg" aria-label="작업 상세">
  <div class="xrow"><button type="button" class="xbtn" id="dlgX">닫기</button></div>
  <div id="dlgBody"></div>
</dialog>

<script>
(function(){
  const DEF = {
    crinPerPy: 8000, crinExtraRate: 0.75, hanBase: 70000, hanCrinExtraShare: 0.5, hanCrinTwo: 35000, crinExternal: 70000,
    ownSmallMaxPy: 26, ownLargeMaxPy: 39, ownRecvSmall: 170000, ownRecvLarge3: 170000, ownRecvLarge2: 240000,
    hanOwnSmall: 70000, hanOwnLarge3: 70000, hanOwnLarge2: 105000,
    ownExtraRate: 1.0, hanOwnExtraShare: 0.5,
    soloMaxPy: 13, ownRecvSolo: 100000, hanOwnSoloTogether: 50000
  };
  const RATE_FIELDS = [
    ["h","크린토피아"],
    ["crinPerPy","평당 정산 (원)"],["crinExternal","3인 평수 · 3명 작업 시 외부인원비 차감 (원)"],["crinExtraRate","추가금 정산 비율 (0.75 = 75%)"],
    ["h","홈클린마스터"],
    ["soloMaxPy","혼자 작업 최대 평수"],["ownRecvSolo","혼자 작업 받는 금액"],["hanOwnSoloTogether","혼자 평수를 김한준님과 함께 갈 때 김한준님 몫"],
    ["ownSmallMaxPy","2인 작업 최대 평수"],["ownLargeMaxPy","3인 작업 최대 평수"],
    ["ownRecvSmall","2인 작업 받는 금액"],["ownRecvLarge3","3인 평수 · 3명 작업 받는 금액"],["ownRecvLarge2","3인 평수 · 2명 작업 받는 금액"],
    ["ownExtraRate","추가금 정산 비율 (1 = 100%)"],
    ["h","김한준님"],
    ["hanBase","크린토피아 건당 기본"],["hanCrinTwo","크린토피아 3인 평수 · 2명 작업 시 추가 (외부인원비 7만원 ÷ 2)"],["hanCrinExtraShare","크린토피아 추가 정산액 중 몫 (0.5 = 절반)"],
    ["hanOwnSmall","홈클린마스터 2인 작업"],["hanOwnLarge3","홈클린마스터 3인 평수 · 3명 작업"],["hanOwnLarge2","홈클린마스터 3인 평수 · 2명 작업"],
    ["hanOwnExtraShare","홈클린마스터 추가 정산액 중 몫 (0.5 = 절반)"]
  ];
  let R = Object.assign({}, DEF);
  const FIRST_DAY = new Date(2026,9,1);   // 집계 시작일
  const FIRST_WEEK = new Date(2026,8,28); // 집계 시작일이 있는 주의 월요일
  const mondayOf = d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const pad=n=>String(n).padStart(2,"0");
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
  const today=new Date();
  const base=today<FIRST_WEEK?FIRST_WEEK:today;
  let week=mondayOf(base);                                  // 선택된 주(월요일)
  let view={y:base.getFullYear(), m:base.getMonth()};       // 보고 있는 달
  let events=[], jobsAll=[], jobsState={}, db=false, canWrite=true, openId=null;
  const $=id=>document.getElementById(id);
  const won=n=>(Math.round(n)||0).toLocaleString("ko-KR")+"원";
  const man=n=>(Math.round(n/1000)/10)+"만";
  const man2=n=>(Math.round(n/100)/100)+"만";
  const monthIdx=(y,m)=>y*12+m;
  const gridStart=()=>mondayOf(new Date(view.y,view.m,1));
  const lastMon=()=>mondayOf(new Date(view.y,view.m+1,0));
  const gridEnd=()=>addDays(lastMon(),6);

  function parse(ev){
    const s = ev.summary||"";
    let kind=null;
    if(s.includes("[크린토피아]")) kind="crin"; else if(s.includes("[홈클린마스터]")||s.includes("[자체영업]")) kind="own"; else return null;
    const py = +((s.match(/(\d+)\s*평/)||[])[1]||0);
    const startStr = (ev.start&&(ev.start.dateTime||ev.start.date))||"";
    const date = startStr.slice(0,10);
    const ampm = s.includes("(오전)")?"오전":s.includes("(오후)")?"오후":(startStr.slice(11,13)<"13"?"오전":"오후");
    const endStr=(ev.end&&(ev.end.dateTime||ev.end.date))||startStr;
    const done = new Date(endStr) <= new Date();
    const cancel = s.includes("취소확인");
    const area = s.replace(/^.*?\]\s*/,"").replace(/\s*\((오전|오후)\)\s*$/,"");
    return {id:ev.id, kind, py, date, ampm, done, cancel, title:area, t:startStr, extraCal:+ev.extraCal||0, crewCal:+ev.crewCal||0, hanCal:+ev.hanCal||0, settleBase:+ev.settleBase||0, settleExtra:+ev.settleExtra||0, settlePark:+ev.settlePark||0};
  }

  const isSolo=j=>j.kind==="own"&&j.py>0&&j.py<=R.soloMaxPy;
  function calc(j, st){
    const fromCal=!(st.extra!=null&&st.extra!==""), calExtra=j.extraCal||(j.kind==="own"?j.settleExtra:0);
    const extra=fromCal?calExtra:+st.extra;
    const calNote=fromCal&&extra?" · 캘린더 메모 기준":"";
    let recv=0, han=0, lines=[], warn=null, baseAmt=0, exAmt=0, hanEx=0;
    if(j.kind==="crin"){
      const mid=j.py>R.ownSmallMaxPy&&j.py<=R.ownLargeMaxPy, cvc=st.crew||j.crewCal, ext=(mid&&+cvc!==2)?R.crinExternal:0;
      const memoBase=j.settleBase>0, base=memoBase?j.settleBase:j.py*R.crinPerPy-ext;
      const memoEx=fromCal&&!j.extraCal&&j.settleExtra>0;           // 메모의 "추가 N원"은 이미 정산액
      const ex=memoEx?j.settleExtra:extra*R.crinExtraRate;
      recv=base+ex; baseAmt=base; exAmt=ex; hanEx=ex*R.hanCrinExtraShare; han=R.hanBase+hanEx;
      lines.push(memoBase?`기본 ${won(base)} (대표 정산내역)`:`기본 ${j.py}평 × ${R.crinPerPy.toLocaleString()}${ext?` − 외부인원비 ${won(ext)}`:""} = ${won(base)}`);
      if(memoEx) lines.push(`추가 정산 ${won(ex)} (대표 정산내역)`);
      else if(extra) lines.push(`추가금 ${won(extra)} × ${R.crinExtraRate*100}% = ${won(ex)}${calNote}`);
      lines.push(`김한준님 ${won(R.hanBase)}${ex?` + 추가 정산 ${won(ex)}의 ${R.hanCrinExtraShare*100}% ${won(ex*R.hanCrinExtraShare)}`:""}`);
      if(mid){
        if(+cvc===2){ han+=R.hanCrinTwo; lines.push(`${j.py}평은 3인 현장 · 2명 작업 → 외부인원비 7만원을 둘이 나눠 김한준님 +${won(R.hanCrinTwo)}`); }
        else lines.push(`${j.py}평은 3인 현장 · 3명 작업 (외부인원 몫 제외)`);
      } else if(j.py>R.ownLargeMaxPy){ warn=`${R.ownLargeMaxPy+1}평 이상은 4인 작업이 예상되는 특수 건입니다. 인원과 금액을 확인하고 직접 입력하세요`; lines.push(warn); }
    } else {
      const cv=st.crew||j.crewCal, crew=+(cv||2), together=+(cv||1)>=2;
      if(isSolo(j)){ recv=R.ownRecvSolo; han=together?R.hanOwnSoloTogether:0; lines.push(`${j.py}평 · ${together?"김한준님과 함께":"혼자 작업"} ${won(recv)}${together?` (김한준님 ${won(han)})`:""}`); }
      else if(j.py<=R.ownSmallMaxPy){ recv=R.ownRecvSmall; han=R.hanOwnSmall; lines.push(`${j.py}평 · 2인 작업 고정 ${won(recv)}`); }
      else if(j.py<=R.ownLargeMaxPy){
        if(crew>=3){ recv=R.ownRecvLarge3; han=R.hanOwnLarge3; lines.push(`${j.py}평 · 3명 작업 ${won(recv)} (외부인원은 거래처 대표가 직접 정산)`); }
        else { recv=R.ownRecvLarge2; han=R.hanOwnLarge2; lines.push(`${j.py}평 · 2명 작업 ${won(recv)} (외부인원 몫 포함)`); }
      } else { recv=R.ownRecvLarge2; han=R.hanOwnLarge2; warn=`${R.ownLargeMaxPy+1}평 이상은 4인 작업이 예상되는 특수 건입니다. 인원과 금액을 확인하고 직접 입력하세요`; lines.push(warn); }
      if(!j.py){ warn="평수를 못 읽음 — 금액 직접 입력 필요"; }
      baseAmt=recv;
      if(extra){ const ex=extra*R.ownExtraRate, hs=(isSolo(j)&&!together)?0:R.hanOwnExtraShare; exAmt=ex; recv+=ex; hanEx=ex*hs; han+=hanEx; lines.push(`추가금 ${won(extra)} × ${R.ownExtraRate*100}% = ${won(ex)}${calNote}${hs?`, 김한준님 몫 ${won(ex*hs)}`:""}`); }
    }
    if(j.hanCal>0){ han=j.hanCal; lines.push(`김한준님 ${won(j.hanCal)} (캘린더 메모 기준, 추가금 몫 포함)`); }
    let parkAmt=j.settlePark||0;
    if(j.settlePark){ recv+=j.settlePark; lines.push(`주차비 ${won(j.settlePark)} (대표 정산내역, 나누지 않음)`); }
    if(st.recvOverride!=null && st.recvOverride!=="" ){ recv=+st.recvOverride; baseAmt=recv; exAmt=0; parkAmt=0; lines.push(`받을 금액 직접 입력 ${won(recv)}`); warn=null; }
    if(st.hanOverride!=null && st.hanOverride!==""){ han=+st.hanOverride; hanEx=0; lines.push(`김한준님 직접 입력 ${won(han)}`); }
    if(st.solo){ han=0; hanEx=0; lines.push("김한준님 미참여"); }
    return {recv, han, mine:recv-han, lines, warn, baseAmt, exAmt, parkAmt, hanEx};
  }

  const isBig=x=>x.j.py>R.ownLargeMaxPy&&x.st.recvOverride==null;
  function agg(list){
    const t={recv:0,han:0,mine:0,crin:0,own:0,done:0};
    for(const x of list){
      if(x.j.cancel||x.st.exclude||!x.j.done) continue;
      t.done++; t.recv+=x.c.recv; t.han+=x.c.han; t.mine+=x.c.mine; t[x.j.kind==="crin"?"crin":"own"]+=x.c.recv;
    }
    return t;
  }

  // 전광판 세 줄 (문구는 정산 규칙 문서 handoff.json과 같다)
  const ROWS=[["recv","정산받을 총액"],["han","김한준님 지급액"],["mine","킴 정산액"]];
  let mode="week";
  const DOW="월화수목금토일";
  const live=x=>!x.j.cancel&&!x.st.exclude;
  const sumOf=list=>{const t={recv:0,han:0,mine:0};for(const x of list){t.recv+=x.c.recv;t.han+=x.c.han;t.mine+=x.c.mine;}return t;};

  function render(){
    const gs=gridStart(), ge=gridEnd(), sun=addDays(week,6), pay=addDays(week,10);
    const lo=ymd(gs), hi=ymd(ge), fw=ymd(FIRST_DAY);
    jobsAll=events.map(parse).filter(Boolean).filter(j=>j.date>=lo&&j.date<=hi&&j.date>=fw)
      .map(j=>{const st=jobsState[j.id]||{};return {j,st,c:calc(j,st)};})
      .sort((a,b)=>a.j.t.localeCompare(b.j.t));

    const mkey=`${view.y}-${pad(view.m+1)}`;
    const monthJobs=jobsAll.filter(x=>x.j.date.slice(0,7)===mkey);
    const mo=agg(monthJobs);
    const isCur=view.y===today.getFullYear()&&view.m===today.getMonth();
    const mname=isCur?"이번 달":`${view.m+1}월`;

    $("vWeek").setAttribute("aria-pressed",String(mode==="week"));
    $("vMonth").setAttribute("aria-pressed",String(mode==="month"));
    if(mode==="week"){
      $("plabel").textContent=`${md(week)}(월) – ${md(sun)}(일)`;
      $("pprev").disabled=+week<=+FIRST_WEEK;
      $("pprev").setAttribute("aria-label","이전 주"); $("pnext").setAttribute("aria-label","다음 주");
      $("ptoday").textContent="이번 주";
      const wlo=ymd(week), whi=ymd(sun);
      const wkJobs=jobsAll.filter(x=>x.j.date>=wlo&&x.j.date<=whi);
      const wk=agg(wkJobs);
      $("btitle").textContent=+week===+mondayOf(today)?"이번 주":`${md(week)} 주`;
      $("bsub").textContent=`크린토피아 ${won(wk.crin)} · 홈클린마스터 ${won(wk.own)} · 완료 ${wk.done}건 기준`;
      $("payday").innerHTML=`정산일 <b>${md(pay)}(목)</b>`;
      const cols=[...Array(7)].map((_,i)=>{const d=addDays(week,i),k=ymd(d);const day=wkJobs.filter(x=>x.j.date===k&&live(x));
        return {head:`${DOW[i]} <span>${d.getDate()===1?`${d.getMonth()+1}/1`:d.getDate()}</span>`,today:k===ymd(today),done:sumOf(day.filter(x=>x.j.done)),est:sumOf(day.filter(x=>!x.j.done)),n:day.length};});
      renderScore(cols,wk,"주 합계");
      $("mside").innerHTML=`<span>${mname} 킴 정산액 <b>${won(mo.mine)}</b></span><span>${mname} 김한준님 지급액 <b>${won(mo.han)}</b></span><span>완료 ${mo.done}건 기준</span>`;
      $("swap").textContent=`${view.m+1}월 전체 보기 →`;
      renderWeek(fw);
    } else {
      $("plabel").textContent=`${view.y}년 ${view.m+1}월`;
      $("pprev").disabled=monthIdx(view.y,view.m)<=monthIdx(FIRST_DAY.getFullYear(),FIRST_DAY.getMonth());
      $("pprev").setAttribute("aria-label","이전 달"); $("pnext").setAttribute("aria-label","다음 달");
      $("ptoday").textContent="이번 달";
      $("btitle").textContent=mname;
      $("bsub").textContent=`크린토피아 ${won(mo.crin)} · 홈클린마스터 ${won(mo.own)} · 완료 ${mo.done}건 기준`;
      $("payday").textContent="주차를 누르면 그 주를 봅니다";
      const first=new Date(view.y,view.m,1), last=new Date(view.y,view.m+1,0);
      const cols=[];
      let n=0;
      for(let m=gridStart(); m<=lastMon(); m=addDays(m,7)){
        if(addDays(m,6)<FIRST_DAY) continue;
        n++;
        const a=m<first?first:m, b=addDays(m,6)>last?last:addDays(m,6);
        const lo2=ymd(a<FIRST_DAY?FIRST_DAY:a), hi2=ymd(b);
        const list=monthJobs.filter(x=>x.j.date>=lo2&&x.j.date<=hi2&&live(x));
        cols.push({head:`<button type="button" data-week="${ymd(m)}" aria-label="${n}주차 ${md(a)}부터 ${md(b)}까지 주간 보기">${n}주<span>${md(a)}–${md(b)}</span></button>`,today:+m===+mondayOf(today),cur:+m===+week,done:sumOf(list.filter(x=>x.j.done)),est:sumOf(list.filter(x=>!x.j.done)),n:list.length});
      }
      renderScore(cols,mo,`${mname} 합계`);
      $("mside").innerHTML=`<span>킴 정산액 = 정산받을 총액 − 김한준님 지급액</span>`;
      $("swap").textContent=`${md(week)} 주 보기 →`;
      renderCal(gs,ge,fw);
    }

    const lv=monthJobs.filter(live);
    const big=lv.filter(isBig).length, warn=lv.filter(x=>x.c.warn&&!isBig(x)).length;
    const p=$("pending"); p.textContent=""; p.hidden=!(big||warn);
    const chip=txt=>{const s=document.createElement("span");s.className="chip";s.textContent=txt;p.appendChild(s);};
    if(big) chip(`${R.ownLargeMaxPy+1}평 이상 ${big}건 · 4인 작업 확인`);
    if(warn) chip(`확인 필요 ${warn}건`);
    refreshDlg();
  }

  // 라인 스코어: 열(요일 또는 주차) × 세 줄 + 합계. 칸은 끝난 일정만, 아직 안 끝난 금액은 작게 "예정"으로.
  function renderScore(cols,tot,totLabel){
    let h=`<colgroup><col class="lc">${cols.map(()=>'<col class="dc">').join("")}<col class="tc"></colgroup><thead><tr><th scope="col"></th>`;
    for(const c of cols) h+=`<th scope="col" class="c${c.today?" today":""}">${c.head}</th>`;
    h+=`<th scope="col" class="tot">${totLabel}</th></tr></thead><tbody>`;
    for(const [k,label] of ROWS){
      h+=`<tr class="${k}"><th scope="row" class="l">${label}</th>`;
      for(const c of cols){
        const v=c.done[k], e=c.est[k];
        if(!c.n) h+=`<td class="c z${c.cur?" cur":""}">–</td>`;
        else h+=`<td class="c${c.cur?" cur":""}">${v?man(v):(e?"–":"0")}${e?`<small>예정 ${man(e)}</small>`:""}</td>`;
      }
      h+=`<td class="tot">${won(tot[k])}</td></tr>`;
    }
    $("score").innerHTML=h+"</tbody>";
  }

  // 주간: 7일 칸, 오전/오후
  function renderWeek(fw){
    const cal=$("cal"); cal.textContent=""; cal.className="wk";
    for(let i=0;i<7;i++){
      const d=addDays(week,i), key=ymd(d);
      const col=document.createElement("div");
      col.className="wd"+(key===ymd(today)?" today":"")+(i===5?" sat":"")+(i===6?" sun":"")+(key<fw?" out":"");
      col.innerHTML=`<div class="wdh num"><b>${d.getMonth()+1}/${d.getDate()}</b><span>${DOW[i]}요일</span></div>`;
      for(const half of ["오전","오후"]){
        const s=document.createElement("div"); s.className="slot"; s.setAttribute("role","group"); s.setAttribute("aria-label",half);
        const lab=document.createElement("i"); lab.textContent=half; s.appendChild(lab);
        for(const x of jobsAll.filter(v=>v.j.date===key&&v.j.ampm===half)) s.appendChild(jobChip(x,d));
        col.appendChild(s);
      }
      const day=jobsAll.filter(x=>x.j.date===key&&live(x));
      if(day.length){
        const t=sumOf(day), f=document.createElement("div");
        f.className="wsum num"+(day.every(x=>x.j.done)?"":" est");
        f.innerHTML=`<span class="m">킴</span><b class="m">${won(t.mine)}</b><span>김한준님</span><b>${won(t.han)}</b>`;
        col.appendChild(f);
      }
      cal.appendChild(col);
    }
  }

  // 월간: 달력. 날짜를 누르면 그 주의 주간 보기로.
  function renderCal(gs,ge,fw){
    const cal=$("cal"); cal.textContent=""; cal.className="cal";
    for(const n of ["월","화","수","목","금","토","일"]){const h=document.createElement("div");h.className="dow";h.textContent=n;cal.appendChild(h);}
    const by={};
    for(const x of jobsAll){(by[x.j.date+"|"+x.j.ampm]=by[x.j.date+"|"+x.j.ampm]||[]).push(x);}
    for(let d=new Date(gs<FIRST_WEEK?FIRST_WEEK:gs); d<=ge; d=addDays(d,1)){
      const key=ymd(d), wkMon=mondayOf(d);
      const cell=document.createElement("div");
      cell.className="day"+(d.getMonth()!==view.m?" out":"")+(key===ymd(today)?" today":"")+(+wkMon===+week?" selw":"")+(key<fw?" pre":"");
      const dn=document.createElement("button"); dn.type="button"; dn.className="dn num";
      const sp=document.createElement("span"); sp.textContent=d.getDate()===1?`${d.getMonth()+1}/1`:String(d.getDate()); dn.appendChild(sp);
      dn.setAttribute("aria-label",`${d.getMonth()+1}월 ${d.getDate()}일이 있는 주 보기`);
      if(key>=fw) dn.addEventListener("click",()=>{mode="week";setWeek(wkMon);}); else dn.disabled=true;
      cell.appendChild(dn);
      for(const half of ["오전","오후"]){
        const h=document.createElement("div"); h.className="half "+(half==="오전"?"am":"pm"); h.setAttribute("role","group"); h.setAttribute("aria-label",half);
        for(const x of by[key+"|"+half]||[]) h.appendChild(jobChip(x,d));
        cell.appendChild(h);
      }
      const day=jobsAll.filter(x=>x.j.date===key&&live(x));
      if(day.length){
        const t=sumOf(day);
        const f=document.createElement("div"); f.className="dsum num"+(day.every(x=>x.j.done)?"":" est");
        f.setAttribute("aria-label",`${d.getMonth()+1}월 ${d.getDate()}일 킴 ${won(t.mine)}, 김한준님 ${won(t.han)}`);
        f.innerHTML=`<span class="m">킴</span><span class="v m">${man(t.mine)}</span><span>김한준님</span><span class="v">${man(t.han)}</span>`;
        cell.appendChild(f);
      }
      cal.appendChild(cell);
    }
  }

  function jobChip(x,d){
    const {j,st,c}=x;
    const b=document.createElement("button"); b.type="button";
    b.className="jb "+j.kind+(j.done?"":" future")+(c.warn?" warn":"")+((j.cancel||st.exclude)?" cancel":"");
    const n=document.createElement("span"); n.className="n"; n.textContent=j.title;
    const a=document.createElement("span"); a.className="a num"; a.textContent=(c.warn?"! ":"")+man2(c.baseAmt)+(c.exAmt?"+"+man2(c.exAmt):"")+(c.parkAmt?"+주차"+man2(c.parkAmt):"");
    b.append(n,a);
    b.setAttribute("aria-label",`${d.getMonth()+1}월 ${d.getDate()}일 ${j.ampm} ${j.title}, 받을 금액 ${won(c.recv)}`);
    b.addEventListener("click",()=>openJob(j.id));
    return b;
  }

  const dlg=$("dlg");
  function openJob(id){
    const x=jobsAll.find(v=>v.j.id===id); if(!x) return;
    openId=id;
    const body=$("dlgBody"); body.textContent="";
    body.appendChild(card(x));
    if(!dlg.open) dlg.showModal();
  }
  function refreshDlg(){
    if(!openId||!dlg.open) return;
    const x=jobsAll.find(v=>v.j.id===openId);
    if(!x){ dlg.close(); return; }
    fill($("dlgBody").firstChild,x);
  }
  dlg.addEventListener("close",()=>{openId=null;});
  dlg.addEventListener("click",e=>{if(e.target===dlg) dlg.close();});
  $("dlgX").addEventListener("click",()=>dlg.close());

  function fill(el,{j,st,c}){
    const d=new Date(j.date+"T00:00:00");
    const wd="일월화수목금토"[d.getDay()];
    el._tags.innerHTML=`<span class="tag ${j.kind}">${j.kind==="crin"?"크린토피아":"홈클린마스터"}</span>`+
      (j.cancel?'<span class="tag warn">취소 확인</span>':"")+
      (c.warn?`<span class="tag warn">${j.py>R.ownLargeMaxPy?R.ownLargeMaxPy+1+"평↑ 4인 확인":"확인 필요"}</span>`:"")+
      (j.done?"":'<span class="tag" style="background:var(--bg)">예정</span>');
    el._meta.textContent=`${d.getMonth()+1}/${d.getDate()}(${wd}) ${j.ampm}`;
    const bd=(b,e,pk)=>(e||pk)?`<div class="bd">기본 ${won(b)}${e?` + 추가금 ${won(e)}`:""}${pk?` + 주차비 ${won(pk)}`:""}</div>`:"";
    const hanBase=c.han-c.hanEx, kimEx=c.exAmt-c.hanEx, kimBase=c.baseAmt-hanBase;
    el._amt.innerHTML=`<b>${won(c.recv)}</b>${bd(c.baseAmt,c.exAmt,c.parkAmt)}`+
      `<div class="who">김한준님 ${won(c.han)}</div>${bd(hanBase,c.hanEx,0)}`+
      `<div class="who">킴 ${won(c.mine)}</div>${bd(kimBase,kimEx,c.parkAmt)}`;
    el._brk.innerHTML=c.lines.map(x=>x.replace(/</g,"&lt;")).join("<br>");
  }

  function card(item){
    const {j,st}=item;
    const el=document.createElement("article"); el.className="job";
    const top=document.createElement("div"); top.className="top";
    const left=document.createElement("div");
    el._tags=document.createElement("div");
    const t=document.createElement("div"); t.className="t"; t.textContent=j.title;
    el._meta=document.createElement("div"); el._meta.className="meta num";
    left.append(el._tags,t,el._meta);
    el._amt=document.createElement("div"); el._amt.className="amt num";
    top.append(left,el._amt); el.appendChild(top);

    const inp=document.createElement("div"); inp.className="inputs";
    const num=(label,key,ph)=>{const l=document.createElement("label");l.textContent=label;const i=document.createElement("input");i.type="number";i.inputMode="numeric";i.step="1000";i.min="0";i.placeholder=ph||"0";i.id=`${key}-${j.id}`;if(st[key]!=null&&st[key]!=="")i.value=st[key];i.disabled=!canWrite;i.addEventListener("change",()=>save(j.id,{[key]:i.value===""?null:+i.value}));l.appendChild(i);return l;};
    const chk=(label,key)=>{const l=document.createElement("label");const i=document.createElement("input");i.type="checkbox";i.id=`${key}-${j.id}`;i.checked=!!st[key];i.disabled=!canWrite;i.addEventListener("change",()=>save(j.id,{[key]:i.checked}));l.append(i,document.createTextNode(label));return l;};
    inp.appendChild(num("추가금(고객가)","extra",j.extraCal?String(j.extraCal):""));
    if(isSolo(j) || (j.py>R.ownSmallMaxPy && j.py<=R.ownLargeMaxPy)){
      const l=document.createElement("label");l.textContent="작업 인원";
      const s=document.createElement("select");s.id=`crew-${j.id}`;s.disabled=!canWrite;
      const solo=isSolo(j);
      for(const [v,tx] of (solo?[["1","혼자 (나)"],["2","김한준님과 함께"]]:[["2","2명 (나+김한준님)"],["3","3명 (외부인원 포함)"]])){const o=document.createElement("option");o.value=v;o.textContent=tx;if(String(st.crew||j.crewCal||(solo?1:(j.kind==="crin"?3:2)))===v)o.selected=true;s.appendChild(o);}
      s.addEventListener("change",()=>save(j.id,{crew:+s.value}));l.appendChild(s);inp.appendChild(l);
    }
    el.appendChild(inp);
    if(j.extraCal||j.crewCal||j.settleBase||j.settleExtra){ const h=document.createElement("div"); h.className="sub"; h.textContent="캘린더 메모의 "+[j.extraCal?`추가금 ${won(j.extraCal)}`:"",j.crewCal?`작업인원 ${j.crewCal}명`:"",(j.kind==="crin"&&j.settleBase)?`정산 ${won(j.settleBase)}${j.settleExtra?` + 추가 ${won(j.settleExtra)}`:""}`:""].filter(Boolean).join(", ")+"을 기본값으로 씁니다. 여기서 직접 바꾸면 그 값이 우선합니다."; el.appendChild(h); }

    const more=document.createElement("details"); more.style.cssText="padding:0;border:0;background:transparent";
    const sm=document.createElement("summary"); sm.style.cssText="font-weight:500;font-size:.8rem;color:var(--muted)"; sm.textContent="계산 내역 · 직접 입력";
    more.appendChild(sm);
    el._brk=document.createElement("div"); el._brk.className="break";
    more.appendChild(el._brk);
    const ov=document.createElement("div"); ov.className="inputs"; ov.style.marginTop="8px";
    ov.appendChild(num("받을 금액 직접","recvOverride","자동"));
    ov.appendChild(num("김한준님 직접","hanOverride","자동"));
    ov.appendChild(chk("김한준님 미참여","solo"));
    ov.appendChild(chk("정산 제외","exclude"));
    more.appendChild(ov);
    el.appendChild(more);
    fill(el,item);
    return el;
  }

  const timers={};
  function save(id,patch){
    jobsState[id]=Object.assign({},jobsState[id]||{},patch);
    render();
    clearTimeout(timers[id]);
    timers[id]=setTimeout(async()=>{
      try{ await put({kind:"job",id,data:jobsState[id]}); }
      catch(e){ showBanner("저장하지 못했습니다. 잠시 후 다시 바꿔 보세요."); }
      timers[id]=null;
    },500);
  }

  function renderRates(){
    const box=$("rates"); box.textContent="";
    for(const [k,label] of RATE_FIELDS){
      if(k==="h"){const h=document.createElement("div");h.className="h";h.textContent=label;box.appendChild(h);continue;}
      const l=document.createElement("label");l.htmlFor="r-"+k;l.textContent=label;
      const i=document.createElement("input");i.type="number";i.id="r-"+k;i.step="any";i.value=R[k];i.className="num";i.disabled=!canWrite;
      i.addEventListener("change",async()=>{R[k]=+i.value;render();if(db){try{await put({kind:"settings",data:R});}catch(e){showBanner("정산 기준을 저장하지 못했습니다.");}}});
      box.append(l,i);
    }
  }

  function showBanner(t){const b=$("banner");b.textContent=t;b.hidden=false;}

  async function api(path,opt){
    const r=await fetch(path,opt);
    if(!r.ok) throw new Error(String(r.status));
    return r.json();
  }
  const put=body=>api("/api/state",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)});

  async function loadEvents(){
    const asked=`${view.y}-${view.m}`;
    $("status").textContent="구글 캘린더에서 작업 일정을 불러오는 중입니다.";
    try{
      const d=await api(`/api/events?start=${ymd(gridStart())}&end=${ymd(gridEnd())}`);
      if(asked!==`${view.y}-${view.m}`) return;
      events=Array.isArray(d.events)?d.events:[];
      const ts=new Date();
      $("status").textContent=`캘린더 기준 ${ts.getHours()}:${pad(ts.getMinutes())} 업데이트`;
      render();
    }catch(e){
      $("status").textContent=events.length?"캘린더를 새로 불러오지 못했습니다. 마지막으로 불러온 내용을 보여줍니다.":"캘린더를 불러오지 못했습니다. 캘린더 연결 설정을 확인해 주세요.";
    }
  }

  async function loadState(){
    try{
      const d=await api("/api/state");
      db=true;
      R=Object.assign({},DEF,d.settings||{});
      for(const id in d.jobs||{}){ if(!timers[id]) jobsState[id]=d.jobs[id]; }
      renderRates(); render();
    }catch(e){ showBanner("저장소에 연결되지 않아 입력값이 저장되지 않습니다. Redis 연결(REDIS_URL)을 확인해 주세요."); }
  }

  function changeMonth(delta){
    const nv=new Date(view.y,view.m+delta,1);
    if(monthIdx(nv.getFullYear(),nv.getMonth())<monthIdx(FIRST_DAY.getFullYear(),FIRST_DAY.getMonth())) return;
    view={y:nv.getFullYear(),m:nv.getMonth()};
    const cur=mondayOf(today);
    let w=(cur>=gridStart()&&cur<=lastMon())?cur:gridStart();
    week=w<FIRST_WEEK?new Date(FIRST_WEEK):w;
    events=[]; render(); loadEvents();
  }
  // 주를 바꾸고, 그 주가 지금 불러온 달 범위를 벗어나면 그 달 일정을 새로 불러온다
  function setWeek(w){
    if(w<FIRST_WEEK) w=new Date(FIRST_WEEK);
    week=w;
    if(w<gridStart()||w>lastMon()){ view={y:w.getFullYear(),m:w.getMonth()}; events=[]; render(); loadEvents(); } else render();
  }
  const changeWeek=delta=>setWeek(addDays(week,7*delta));
  $("pprev").addEventListener("click",()=>mode==="week"?changeWeek(-1):changeMonth(-1));
  $("pnext").addEventListener("click",()=>mode==="week"?changeWeek(1):changeMonth(1));
  $("vWeek").addEventListener("click",()=>{mode="week";render();});
  $("vMonth").addEventListener("click",()=>{mode="month";render();});
  $("swap").addEventListener("click",()=>{mode=mode==="week"?"month":"week";render();});
  $("ptoday").addEventListener("click",()=>{
    if(mode==="week") setWeek(mondayOf(today));
    else { const d=monthIdx(today.getFullYear(),today.getMonth())-monthIdx(view.y,view.m); if(d) changeMonth(d); }
  });
  $("score").addEventListener("click",e=>{const b=e.target.closest("[data-week]");if(!b)return;const [y,m,d]=b.dataset.week.split("-").map(Number);mode="week";setWeek(new Date(y,m-1,d));});

  render(); renderRates();

  loadState(); loadEvents();
  setInterval(()=>{ loadEvents(); loadState(); },60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ loadEvents(); loadState(); } });
})();
</script>

</body></html>
